name: Deploy LetterOff to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - run: npm ci
      - name: Build LetterOff
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_BACKEND_MODE: ags
          VITE_AGS_BASE_URL: https://sademo-letteroff.prod.gamingservices.accelbyte.io
          VITE_AGS_NAMESPACE: sademo-letteroff
          VITE_AGS_CLIENT_ID: 8309bbdfb1eb463b87d8b849a35bd10e
          VITE_AGS_SESSION_TEMPLATE: letteroff-room
          VITE_AGS_MATCH_POOL: letteroff-quick
        run: npm run build -- --base "${PAGES_BASE_PATH%/}/"
      - name: Upload Pages build
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
